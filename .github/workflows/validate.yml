name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # `brands`: dropped once the home-assistant/brands PR lands. No new
          # repository can pass this one -- the check reads an upstream
          # repository this project has no entry in yet.
          # `images`: dropped once a real screenshot is added to README.
          ignore: brands images

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed bundle must match a fresh build
        run: git diff --exit-code custom_components/rss_newsreader/frontend/

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install feedparser==6.0.12 nh3==0.3.6 readability-lxml==0.8.4.1 pytest
      - run: python -m pytest tests/ -q
